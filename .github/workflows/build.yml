name: Build launcher APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk cleanyourtv-launcher.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cleanyourtv-launcher
          path: cleanyourtv-launcher.apk

      # Public, no-login download for `tvctl.py update`:
      # https://github.com/<owner>/cleanyourtv/releases/latest/download/cleanyourtv-launcher.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CleanYourTV build ${{ github.run_number }}
          make_latest: true
          files: cleanyourtv-launcher.apk
